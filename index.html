<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Poker · Texas Hold’em</title>
    <meta name="theme-color" content="#101b19">
    <meta name="description" content="Jogue Texas Hold’em contra três bots, no celular ou computador, com fichas virtuais.">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="shortcut icon" href="static/images/icons/poker.svg" />
</head>

<body>
    <div id="game-container">
        <header class="app-header">
            <div class="brand"><span class="brand-mark" aria-hidden="true">♠</span><div><h1>POKER</h1><p>Texas Hold’em</p></div></div>
            <a href="rules.html" id="rules-button" class="top-button">Como jogar <span aria-hidden="true">›</span></a>
        </header>
        <div class="table-meta"><span>4 jogadores · Fichas virtuais</span><span id="phase-label">Pré-flop</span></div>
        <div id="poker-table" role="region" aria-label="Mesa de poker">
            <!-- Áreas dos Jogadores -->
            <div class="player-area" id="player-0"> <!-- Humano (Bottom) -->
                <div class="player-info">
                    <div class="player-name">Jogador</div>
                    <div class="player-chips">$0</div>
                    <div class="dealer-button" style="display: none;">D</div>
                    <div class="player-status"></div>
                </div>
                <div class="player-cards">
                    <!-- Cartas do jogador serão inseridas aqui -->
                </div>
            </div>
            <div class="player-area" id="player-1"> <!-- IA 1 (Left) -->
                <div class="player-info">
                    <div class="player-name">AI 1</div>
                    <div class="player-chips">$0</div>
                    <div class="dealer-button" style="display: none;">D</div>
                    <div class="player-status"></div>
                </div>
                <div class="player-cards"></div>
            </div>
            <div class="player-area" id="player-2"> <!-- IA 2 (Top) -->
                <div class="player-info">
                    <div class="player-name">AI 2</div>
                    <div class="player-chips">$0</div>
                    <div class="dealer-button" style="display: none;">D</div>
                    <div class="player-status"></div>
                </div>
                <div class="player-cards"></div>
            </div>
            <div class="player-area" id="player-3"> <!-- IA 3 (Right) -->
                <div class="player-info">
                    <div class="player-name">AI 3</div>
                    <div class="player-chips">$0</div>
                    <div class="dealer-button" style="display: none;">D</div>
                    <div class="player-status"></div>
                </div>
                <div class="player-cards"></div>
            </div>

            <!-- Centro da Mesa -->
            <div id="table-center">
                <div id="pot">Pote · $<span>0</span></div>
                <div id="community-cards">
                    <!-- Cartas comunitárias serão inseridas aqui -->
                </div>
            </div>
        </div>

        <!-- Controles do Jogador Humano -->
        <section id="controls-container" aria-label="Suas jogadas">
            <p id="turn-message" role="status" aria-live="polite">Preparando a mesa…</p>
            <p class="quick-bet-label">Apostas rápidas · jogada imediata</p>

            <!-- Botões de Aposta Rápida -->
            <div id="quick-bet-controls" class="controls-disabled">
                <button id="btn-min-bet" title="Aposta/Raise Mínimo">Mínimo</button>
                <button id="btn-half-pot" title="Metade do Pote">½ pote</button>
                <button id="btn-pot-bet" title="Tamanho do Pote">Pote</button>
                <button id="btn-max-bet" title="Apostar todas as fichas">All-in</button>
            </div>

            <!-- Controles Principais -->
            <div id="action-controls" class="controls-disabled">
                <button id="btn-fold">Desistir</button>
                <button id="btn-check-call">Passar</button>
                <button id="btn-bet-raise">Apostar</button>
                <div class="bet-field"><label for="bet-amount">Aposta total nesta fase</label><input type="number" inputmode="numeric" id="bet-amount" placeholder="Valor" min="0" step="1" aria-describedby="min-raise-info action-error"></div>
                <!-- O div min-raise-info pode ser mantido ou removido se não for mais usado -->
                <p id="min-raise-info"></p>
                <p id="action-error" role="alert"></p>
            </div>

        </section> <!-- Fim do controls-container -->

        <!-- Log do Jogo -->
        <details id="history-panel">
            <summary>Histórico da mesa</summary>
        <div id="game-log" role="log" aria-label="Histórico da mesa">
            <p>Bem-vindo ao Poker!</p>
        </div>
        </details>
        <footer class="app-footer">Sem dinheiro real. Só uma boa partida.</footer>
    </div>

    <!-- Scripts -->
    <script src="static/js/poker-ai.js"></script>
    <script src="static/js/poker-logic.js"></script>
    <script src="static/js/ui-controller.js"></script>
</body>

</html>
